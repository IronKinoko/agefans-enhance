<div id="subListContainer" class="text_list_box mb-4">
  <div class="text_list_box--hd">
    <div class="d-flex align-items-start justify-content-between gap-2 pb-2">
      <div>
        <h6 class="title mb-0">订阅列表</h6>
        <span class="update-info" title="点击可强制更新数据"></span>
      </div>
      <div data-subscription-view-switch></div>
    </div>
  </div>
  <div id="subList"></div>
</div>

<div id="subList">
  {{# if (groups.every(o => o.list.length === 0)) { }}
  <div class="text_list_box--bd">
    <div class="text_list_box_wrapper">
      <ul class="text_list_item">
        <li>
          <div class="d-flex position-relative">
            <div class="flex-grow-1 text-truncate pe-2">
              订阅喜欢的番剧，在播放页面标题右侧添加订阅
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
  {{# } }}
  <!--  -->
  {{# groups.filter(o => !!o.list.length).forEach(({list, day}) => { }}
  <div class="text_list_box--bd">
    <div class="sub-group-day">{{day}}</div>
    <div class="text_list_box_wrapper">
      <ul class="text_list_item">
        {{# list.forEach(item => { }}
        <li>
          <div class="d-flex position-relative">
            <div class="text-truncate pe-2">
              <a
                href="{{item.current.url}}"
                class="text-decoration-none link-light common_alink"
                >{{item.title}}</a
              >
            </div>
            <div class="flex-grow-1 title_new"></div>
            <div class="title_sub text-truncate">
              <a
                class="text-decoration-none link-light common_alink"
                href="{{item.current.url}}"
                >{{item.current.title}}</a
              >
              <span>/</span>
              <a
                class="text-decoration-none link-light common_alink"
                href="{{item.last.url}}"
                >{{item.last.title}}</a
              >
            </div>

            <div class="sub-thumbnail-box">
              <img
                class="sub-thumbnail"
                src="{{item.thumbnail}}"
                alt="{{item.title}}"
              />
            </div>
          </div>
        </li>
        {{# }) }}
      </ul>
    </div>
  </div>
  {{# }) }}
</div>
