<section id="subListContainer" class="content-visibility-auto">
  <div class="mb-4 flex items-center justify-between gap-4">
    <h2 class="text-xl font-semibold text-foreground md:text-2xl">订阅番组</h2>
    <button
      class="update-info inline-flex items-center gap-1 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground"
      title="点击可强制更新数据"
      type="button"
    >
      检查更新
    </button>
  </div>
  <div id="subList"></div>
</section>

<div id="subList">
  {{# if (list.length === 0) { }}
  <div
    class="rounded-lg border border-border bg-card p-4 text-sm text-muted-foreground"
  >
    订阅喜欢的番剧，在播放页面标题右侧添加订阅
  </div>
  {{# } else { }}
  <div
    class="grid grid-cols-3 gap-3 sm:grid-cols-4 sm:gap-4 lg:grid-cols-6 lg:gap-5"
  >
    {{# list.forEach((item) => { }}
    <a
      class="group block min-w-0 rounded-lg transition-transform duration-200 hover:-translate-y-0.5"
      href="{{item.current.url}}"
    >
      <span
        class="relative block overflow-hidden bg-muted aspect-[3/4] isolate rounded-lg [backface-visibility:hidden] [clip-path:inset(0_round_0.5rem)] [contain:paint] [transform:translateZ(0)]"
      >
        <img
          alt="{{item.title}}"
          loading="lazy"
          decoding="async"
          class="block h-full w-full object-cover transform-gpu transition-transform duration-300 [backface-visibility:hidden] group-hover:scale-[1.04]"
          src="{{item.thumbnail}}"
        />
        <span
          class="absolute right-2 top-2 inline-flex h-[22px] max-w-[calc(100%-16px)] items-center rounded-md bg-black/60 px-2 text-xs font-semibold text-white backdrop-blur max-sm:right-1.5 max-sm:top-1.5 max-sm:h-[18px] max-sm:px-1.5 max-sm:text-[10px]"
          >{{item.status || item.last.title}}</span
        >
        <span
          class="absolute bottom-2 right-2 inline-flex h-[22px] max-w-[calc(100%-16px)] items-center rounded-md bg-black/60 px-2 text-xs font-medium text-white backdrop-blur max-sm:bottom-1.5 max-sm:right-1.5 max-sm:h-[18px] max-sm:px-1.5 max-sm:text-[10px]"
          >{{item.current.title}} / {{item.last.title}}</span
        >
      </span>
      <div
        class="mt-2.5 line-clamp-2 text-sm font-medium leading-[1.4] text-card-foreground transition-colors group-hover:text-primary max-sm:mt-1.5 max-sm:text-xs"
      >
        {{item.title}}
      </div>
    </a>
    {{# }) }}
  </div>
  {{# } }}
</div>
